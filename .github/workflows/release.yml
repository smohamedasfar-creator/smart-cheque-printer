# Builds the Windows installer from the repository, signs it with SignPath when signing is configured,
# and attaches it to a draft GitHub release for tags like v1.0.1.
#
# Signing setup (after SignPath Foundation approves the project), in the repository settings:
#   Secrets:   SIGNPATH_API_TOKEN
#   Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG (smart-cheque-printer),
#              SIGNPATH_SIGNING_POLICY_SLUG (release-signing), SIGNPATH_ARTIFACT_CONFIGURATION_SLUG (initial)

name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: npm run build && npx electron-builder --win --publish never

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1
          Copy-Item $exe.FullName "out/Smart-Cheque-Printer-Setup-${{ github.ref_name }}.exe"
          Get-ChildItem out

      - name: Upload unsigned installer
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: out/*.exe
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-signed
          path: signed/*.exe
          if-no-files-found: error

  release:
    needs: [build, sign]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.sign.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download signed installer
        if: ${{ needs.sign.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: installer-signed
          path: dist

      - name: Download unsigned installer (signing not configured yet)
        if: ${{ needs.sign.result != 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: installer-unsigned
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.exe \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Smart Cheque Printer ${{ github.ref_name }}" \
            --notes "Draft created by the build workflow. Signed: ${{ needs.sign.result == 'success' }}. Review, add notes and publish."
